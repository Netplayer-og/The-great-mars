<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLD-MINER : Meme Stock & Crypto Market</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Side Control Panel */
        #sidebar {
            width: 320px;
            background-color: #161b22;
            border-right: 2px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        h1 {
            font-size: 1.4rem;
            color: #f1e05a;
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wallet-card {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .wallet-title {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: bold;
        }
        .wallet-balance {
            font-size: 1.5rem;
            color: #3fb950;
            font-weight: bold;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.85rem;
            color: #8b949e;
            font-weight: bold;
        }
        input, button {
            padding: 10px;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        input:focus {
            outline: none;
            border-color: #f1e05a;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
        button:active {
            transform: scale(0.98);
        }
        .action-btn {
            background-color: #238636;
            border-color: #2ea043;
            color: white;
        }
        .action-btn:hover {
            background-color: #2ea043;
        }
        .sell-btn {
            background-color: #da3633;
            border-color: #f85149;
            color: white;
        }
        .sell-btn:hover {
            background-color: #f85149;
        }

        /* Main Marketplace Viewport */
        #main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: radial-gradient(circle at top right, #1f2430 0%, #0d1117 70%);
        }
        .section-title {
            font-size: 1.1rem;
            color: #f1e05a;
            margin-bottom: 10px;
        }
        
        /* Market Grid */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }
        .coin-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: border-color 0.2s;
        }
        .coin-card:hover {
            border-color: #8b949e;
        }
        .coin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .coin-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }
        .coin-symbol {
            font-size: 0.75rem;
            background: #30363d;
            padding: 2px 6px;
            border-radius: 4px;
            color: #8b949e;
        }
        .coin-price {
            font-size: 1.3rem;
            font-weight: bold;
        }
        .price-up { color: #3fb950; }
        .price-down { color: #f85149; }
        
        .coin-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .holding-info {
            font-size: 0.8rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }
        .holding-val {
            color: #f1e05a;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h1><span>⛏️</span> GOLD-MINER</h1>
        
        <div class="wallet-card">
            <span class="wallet-title">Cash Balance ($USD)</span>
            <span id="cash-balance" class="wallet-balance">$1,000.00</span>
        </div>

        <div class="control-group">
            <label>Launch Your Own Coin</label>
            <input type="text" id="custom-name" placeholder="Coin Name (e.g. CatCoin)">
            <input type="text" id="custom-symbol" placeholder="Symbol (e.g. MEOW)">
            <button class="action-btn" onclick="createCustomCoin()">Launch Coin ($500 Fee)</button>
        </div>

        <div class="control-group" style="margin-top: auto;">
            <label>Market Actions</label>
            <button onclick="resetGame()" style="background:#21262d; border-color:#f85149; color:#f85149;">Bankruptcy Reset</button>
        </div>
    </div>

    <div id="main-content">
        <div>
            <div class="section-title">📈 Live Crypto & Meme Market</div>
            <div id="market-grid" class="market-grid">
                </div>
        </div>
    </div>

    <script>
        // --- Game State & Initial Data ---
        let cash = 1000.00;
        
        // Initial 4 Coins
        let coins = [
            { id: 'doge', name: 'Dogecoin', symbol: 'DOGE', price: 0.12, holdings: 1000, history: [] },
            { id: 'gold', name: 'Gold Coin', symbol: 'GLD', price: 1850.50, holdings: 0, history: [] },
            { id: 'btc', name: 'Bitcoin', symbol: 'BTC', price: 64200.00, holdings: 0, history: [] },
            { id: 'amogus', name: 'AMOGUS coin', symbol: 'SUS', price: 0.0069, holdings: 0, history: [] }
        ];

        // --- Web Audio Sound Generator ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'buy') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'sell') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.linearRampToValueAtTime(200, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'launch') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- Core Simulation Tick (Price fluctuations every 1.5s) ---
        setInterval(() => {
            coins.forEach(coin => {
                // Volatility factor based on coin type
                let volatility = coin.price * 0.08;
                if (coin.id === 'btc') volatility = coin.price * 0.03;
                if (coin.symbol === 'SUS') volatility = coin.price * 0.25; // AMOGUS is chaotic

                const change = (Math.random() - 0.48) * volatility; // slight upward drift bias
                coin.price = Math.max(0.0001, coin.price + change);
            });
            renderMarket();
        }, 1500);

        // --- Rendering Market UI ---
        function renderMarket() {
            document.getElementById('cash-balance').innerText = `$${cash.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';

            coins.forEach(coin => {
                const holdingValue = coin.holdings * coin.price;
                const card = document.createElement('div');
                card.className = 'coin-card';
                card.innerHTML = `
                    <div class="coin-header">
                        <span class="coin-name">${coin.name}</span>
                        <span class="coin-symbol">${coin.symbol}</span>
                    </div>
                    <div class="coin-price">$${coin.price < 1 ? coin.price.toFixed(4) : coin.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                    <div class="holding-info">
                        <span>Owned: ${coin.holdings < 10 ? coin.holdings.toFixed(2) : Math.floor(coin.holdings)}</span>
                        <span class="holding-val">$${holdingValue.toFixed(2)}</span>
                    </div>
                    <div class="coin-actions">
                        <button class="action-btn" onclick="buyCoin('${coin.id}')">Buy</button>
                        <button class="sell-btn" onclick="sellCoin('${coin.id}')">Sell</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- Trading Logic ---
        function buyCoin(coinId) {
            const coin = coins.find(c => c.id === coinId);
            const buyAmount = coin.price * 10; // buy 10 units worth or check cash
            
            // For expensive coins like BTC, buy fractional or single units
            const cost = coin.price > 1000 ? coin.price * 0.1 : coin.price * 10;
            const units = coin.price > 1000 ? 0.1 : 10;

            if (cash >= cost) {
                cash -= cost;
                coin.holdings += units;
                playSound('buy');
                renderMarket();
            } else {
                alert("Not enough cash, bro!");
            }
        }

        function sellCoin(coinId) {
            const coin = coins.find(c => c.id === coinId);
            const unitsToSell = coin.price > 1000 ? 0.1 : 10;

            if (coin.holdings >= unitsToSell) {
                coin.holdings -= unitsToSell;
                cash += coin.price * unitsToSell;
                playSound('sell');
                renderMarket();
            } else {
                alert("You don't own enough of this coin to sell!");
            }
        }

        // --- Custom Coin Creator ---
        function createCustomCoin() {
            const nameInput = document.getElementById('custom-name');
            const symbolInput = document.getElementById('custom-symbol');
            
            const name = nameInput.value.trim();
            const symbol = symbolInput.value.trim().toUpperCase();

            if (!name || !symbol) {
                alert("Please enter a valid coin name and symbol!");
                return;
            }

            if (cash < 500) {
                alert("Launching a coin costs $500 USD fee!");
                return;
            }

            cash -= 500;
            playSound('launch');

            const newCoin = {
                id: 'custom_' + Date.now(),
                name: name,
                symbol: symbol,
                price: parseFloat((Math.random() * 5 + 0.1).toFixed(2)),
                holdings: 100, // free starter pack of your own coin
                history: []
            };

            coins.push(newCoin);
            nameInput.value = '';
            symbolInput.value = '';
            renderMarket();
        }

        function resetGame() {
            if (confirm("Are you sure you want to declare bankruptcy and reset?")) {
                cash = 1000.00;
                coins = [
                    { id: 'doge', name: 'Dogecoin', symbol: 'DOGE', price: 0.12, holdings: 1000, history: [] },
                    { id: 'gold', name: 'Gold Coin', symbol: 'GLD', price: 1850.50, holdings: 0, history: [] },
                    { id: 'btc', name: 'Bitcoin', symbol: 'BTC', price: 64200.00, holdings: 0, history: [] },
                    { id: 'amogus', name: 'AMOGUS coin', symbol: 'SUS', price: 0.0069, holdings: 0, history: [] }
                ];
                renderMarket();
            }
        }

        // Initial paint
        renderMarket();
    </script>
</body>
</html>
