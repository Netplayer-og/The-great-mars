<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Level Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background-color: #0b0a10; color: #fff;
            font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
        }
        h1 { font-size: 20px; margin-bottom: 10px; text-shadow: 3px 3px 0px #000; }
        .back-link { position: absolute; top: 15px; left: 15px; color: #aaa; text-decoration: none; font-size: 10px; }
        canvas { border: 4px solid #a855f7; box-shadow: 6px 6px 0px #000; image-rendering: pixelated; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ MAIN MENU</a>
    <h1 id="mode-title">CUSTOM MODE</h1>

    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const activeModId = localStorage.getItem('mars_active_mod');
        const customMods = JSON.parse(localStorage.getItem('mars_custom_mods') || '[]');
        const mod = customMods.find(m => m.id === activeModId) || {
            title: "Empty Mode", template: "empty", bgColor: "#1f2937",
            npc: { name: "Guest", sprite: "Pixelgame/musa.png", role: "neutral", talk: "Welcome!", x: 400, y: 250, vx: 2, vy: 2 }
        };

        document.getElementById('mode-title').innerText = mod.title.toUpperCase();

        const playerImage = new Image();
        playerImage.src = 'Pixelgame/musa.png';

        const npcImage = new Image();
        npcImage.src = mod.npc.sprite;

        const player = { x: 100, y: 250, size: 50, speed: 4, hp: 100 };
        const npc = { ...mod.npc };
        let dialogueText = "Walk up to characters or explore!";
        const blocks = [];
        let lavaY = 500;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Click to place blocks in Building Mode
        canvas.addEventListener('click', e => {
            if (mod.template === 'building') {
                const rect = canvas.getBoundingClientRect();
                const bx = Math.floor((e.clientX - rect.left) / 40) * 40;
                const by = Math.floor((e.clientY - rect.top) / 40) * 40;
                blocks.push({ x: bx, y: by });
            }
        });

        function update() {
            if ((keys['w'] || keys['arrowup']) && player.y > 30) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - 30) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > 30) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - 30) player.x += player.speed;

            // AI CHARACTER ROLES LOGIC
            let dist = Math.hypot(player.x - npc.x, player.y - npc.y);

            if (npc.role === 'enemy') {
                if (player.x > npc.x) npc.x += 1.5;
                if (player.x < npc.x) npc.x -= 1.5;
                if (player.y > npc.y) npc.y += 1.5;
                if (player.y < npc.y) npc.y -= 1.5;
                if (dist < 40) {
                    player.hp -= 0.5;
                    dialogueText = "⚠️ ENEMY ATTACKING YOU!";
                }
            } else if (npc.role === 'team') {
                if (dist > 60) {
                    if (player.x > npc.x) npc.x += 2;
                    if (player.x < npc.x) npc.x -= 2;
                    if (player.y > npc.y) npc.y += 2;
                    if (player.y < npc.y) npc.y -= 2;
                }
                if (dist < 60) dialogueText = npc.talk;
            } else if (npc.role === 'roamer') {
                npc.x += npc.vx;
                npc.y += npc.vy;
                if (npc.x < 50 || npc.x > 750) npc.vx *= -1;
                if (npc.y < 50 || npc.y > 450) npc.vy *= -1;
                if (dist < 60) dialogueText = npc.talk;
            } else if (npc.role === 'neutral') {
                if (dist < 60) dialogueText = npc.talk;
            }

            // MECHANICS TEMPLATES LOGIC
            if (mod.template === 'lava') {
                lavaY -= 0.2;
                if (player.y > lavaY) {
                    player.hp -= 1;
                    dialogueText = "🔥 BURNING IN LAVA! GET HIGHER!";
                }
            }

            if (player.hp <= 0) {
                alert("GAME OVER!");
                player.x = 100; player.y = 250; player.hp = 100; lavaY = 500;
            }
        }

        function draw() {
            ctx.fillStyle = mod.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lava Mode Rendering
            if (mod.template === 'lava') {
                ctx.fillStyle = "rgba(255, 69, 0, 0.8)";
                ctx.fillRect(0, lavaY, canvas.width, canvas.height - lavaY);
            }

            // Building Mode Blocks Rendering
            blocks.forEach(b => {
                ctx.fillStyle = "#8b5cf6";
                ctx.fillRect(b.x, b.y, 40, 40);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(b.x, b.y, 40, 40);
            });

            // Draw NPC
            if (npcImage.complete && npcImage.naturalWidth !== 0) {
                ctx.drawImage(npcImage, npc.x - 25, npc.y - 25, 50, 50);
            } else {
                ctx.fillStyle = "#e11d48";
                ctx.fillRect(npc.x - 25, npc.y - 25, 50, 50);
            }

            ctx.fillStyle = "#fff";
            ctx.font = "6px 'Press Start 2P'";
            ctx.fillText(npc.name + ` [${npc.role.toUpperCase()}]`, npc.x - 30, npc.y - 35);

            // Draw Player
            if (playerImage.complete && playerImage.naturalWidth !== 0) {
                ctx.drawImage(playerImage, player.x - 25, player.y - 25, 50, 50);
            }

            // HUD / Dialogue
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(50, 420, 700, 50);
            ctx.strokeStyle = "#a855f7";
            ctx.lineWidth = 2;
            ctx.strokeRect(50, 420, 700, 50);

            ctx.fillStyle = "#fff";
            ctx.font = "7px 'Press Start 2P'";
            ctx.fillText(dialogueText, 65, 450);

            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}`, 60, 30);
            if (mod.template === 'building') ctx.fillText("CLICK TO PLACE BLOCKS", 500, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
