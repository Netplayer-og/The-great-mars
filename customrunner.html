<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Level Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background-color: #0b0a10; color: #fff;
            font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
        }
        h1 { font-size: 20px; margin-bottom: 10px; text-shadow: 3px 3px 0px #000; }
        .back-link { position: absolute; top: 15px; left: 15px; color: #aaa; text-decoration: none; font-size: 10px; }
        canvas { border: 4px solid #a855f7; box-shadow: 6px 6px 0px #000; image-rendering: pixelated; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ MAIN MENU</a>
    <h1 id="mode-title">CUSTOM MODE</h1>

    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Load active mod selected from Main Menu
        const activeModId = localStorage.getItem('mars_active_mod');
        const customMods = JSON.parse(localStorage.getItem('mars_custom_mods') || '[]');
        const mod = customMods.find(m => m.id === activeModId) || {
            title: "Fallback Mode", bgColor: "#1f2937",
            npc: { name: "Guest", talk: "No mod selected!", color: "#e11d48", x: 400, y: 250 }
        };

        document.getElementById('mode-title').innerText = mod.title.toUpperCase();

        const player = { x: 100, y: 250, size: 50, speed: 4 };
        let dialogueText = "Walk up to the character to speak!";
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            if ((keys['w'] || keys['arrowup']) && player.y > 30) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - 30) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > 30) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - 30) player.x += player.speed;

            // Proximity check with custom NPC
            let dist = Math.hypot(player.x - mod.npc.x, player.y - mod.npc.y);
            if (dist < 60) {
                dialogueText = mod.npc.talk;
            }
        }

        function draw() {
            // Fill level custom background color
            ctx.fillStyle = mod.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Custom NPC
            ctx.fillStyle = mod.npc.color;
            ctx.fillRect(mod.npc.x - 25, mod.npc.y - 25, 50, 50);
            ctx.fillStyle = "#fff";
            ctx.font = "6px 'Press Start 2P'";
            ctx.fillText(mod.npc.name, mod.npc.x - 25, mod.npc.y - 35);

            // Draw Player
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);

            // Dialogue Box
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(50, 420, 700, 50);
            ctx.strokeStyle = "#a855f7";
            ctx.lineWidth = 2;
            ctx.strokeRect(50, 420, 700, 50);

            ctx.fillStyle = "#fff";
            ctx.font = "7px 'Press Start 2P'";
            ctx.fillText(dialogueText, 65, 450);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
