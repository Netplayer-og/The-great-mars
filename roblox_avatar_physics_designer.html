<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Sandbox Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Side Control Panel */
        #sidebar {
            width: 280px;
            background-color: #1e1e1e;
            border-right: 2px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 1.4rem;
            color: #bb86fc;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.9rem;
            color: #b0b0b0;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            padding: 10px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        button:hover {
            background-color: #3d3d3d;
            border-color: #bb86fc;
        }
        button.active {
            background-color: #bb86fc;
            color: #121212;
            border-color: #bb86fc;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #444;
            border-radius: 6px;
        }
        .danger-btn {
            background-color: #cf6679;
            color: #121212;
            border: none;
        }
        .danger-btn:hover {
            background-color: #e48596;
        }
        .instructions {
            font-size: 0.8rem;
            color: #888;
            line-height: 1.4;
            margin-top: auto;
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }
        /* Canvas Container */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #1e1e1e 0%, #0a0a0a 100%);
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Physics Sandbox</h2>
        
        <div class="control-group">
            <label>Shape Tool</label>
            <div class="btn-grid">
                <button id="btn-box" class="active" onclick="setShape('box')">Box</button>
                <button id="btn-circle" onclick="setShape('circle')">Circle</button>
            </div>
        </div>

        <div class="control-group">
            <label>Object Color</label>
            <input type="color" id="colorPicker" value="#03dac6">
        </div>

        <div class="control-group">
            <label>Environment</label>
            <button id="btn-gravity" onclick="toggleGravity()">Toggle Gravity: ON</button>
        </div>

        <div class="control-group">
            <label>Actions</label>
            <button class="danger-btn" onclick="clearWorld()">Clear All Objects</button>
        </div>

        <div class="instructions">
            <strong>How to play:</strong><br>
            • Click & Drag anywhere on the canvas to spawn and <strong>throw</strong> objects with momentum.<br>
            • Click existing objects to give them a sudden impulse kick!
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // Module aliases
        const { Engine, Render, Runner, Bodies, Composite, Constraint, Mouse, MouseConstraint, Vector, Events } = Matter;

        // Create an engine
        const engine = Engine.create();
        const world = engine.world;

        // Get container dimensions
        const container = document.getElementById('canvas-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        // Create a renderer
        const render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // Add Boundaries (Walls, Floor, Ceiling)
        const wallThickness = 50;
        const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width, wallThickness, { isStatic: true, render: { fillStyle: '#222' } });
        const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height, { isStatic: true, render: { fillStyle: '#222' } });
        const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height, { isStatic: true, render: { fillStyle: '#222' } });
        const ceiling = Bodies.rectangle(width / 2, -wallThickness / 2, width, wallThickness, { isStatic: true, render: { fillStyle: '#222' } });
        
        Composite.add(world, [ground, leftWall, rightWall, ceiling]);

        // --- State Management ---
        let currentShape = 'box';
        let gravityEnabled = true;

        function setShape(shape) {
            currentShape = shape;
            document.getElementById('btn-box').classList.remove('active');
            document.getElementById('btn-circle').classList.remove('active');
            document.getElementById(`btn-${shape}`).classList.add('active');
            playSound('click');
        }

        function toggleGravity() {
            gravityEnabled = !gravityEnabled;
            engine.world.gravity.y = gravityEnabled ? 1 : 0;
            const btn = document.getElementById('btn-gravity');
            btn.innerText = `Toggle Gravity: ${gravityEnabled ? 'ON' : 'OFF'}`;
            btn.classList.toggle('active', gravityEnabled);
            playSound('click');
        }

        function clearWorld() {
            // Keep the boundaries (first 4 elements)
            const bodies = Composite.allBodies(world);
            const toRemove = bodies.slice(4);
            Composite.remove(world, toRemove);
            playSound('clear');
        }

        // --- Web Audio API (Sound System) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'spawn') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'bounce') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                gainNode.gain.setValueAtTime(0.08, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'clear') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Add collision sound trigger
        Events.on(engine, 'collisionStart', (event) => {
            event.pairs.forEach((pair) => {
                // Play bounce sound if impact speed is high enough
                const speed = Vector.magnitude(Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
                if (speed > 2) {
                    playSound('bounce');
                }
            });
        });

        // --- Throw / Spawn Mechanics via Mouse Interaction ---
        let isMouseDown = false;
        let startPoint = null;

        const canvasEl = render.canvas;

        canvasEl.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            startPoint = { x: e.offsetX, y: e.offsetY };
        });

        canvasEl.addEventListener('mouseup', (e) => {
            if (!isMouseDown) return;
            isMouseDown = false;
            
            const endPoint = { x: e.offsetX, y: e.offsetY };
            
            // Calculate drag distance / vector for throwing velocity
            const throwVector = {
                x: (startPoint.x - endPoint.x) * 0.15,
                y: (startPoint.y - endPoint.y) * 0.15
            };

            const color = document.getElementById('colorPicker').value;
            let body;

            if (currentShape === 'box') {
                const size = 40 + Math.random() * 30;
                body = Bodies.rectangle(startPoint.x, startPoint.y, size, size, {
                    render: { fillStyle: color },
                    restitution: 0.6,
                    friction: 0.1
                });
            } else {
                const radius = 20 + Math.random() * 20;
                body = Bodies.circle(startPoint.x, startPoint.y, radius, {
                    render: { fillStyle: color },
                    restitution: 0.7,
                    friction: 0.1
                });
            }

            // Apply velocity throw effect
            Matter.Body.setVelocity(body, throwVector);
            Composite.add(world, body);
            playSound('spawn');
        });

        // Handle window resizing gracefully
        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            
            render.options.width = newWidth;
            render.options.height = newHeight;
            Render.setPixelRatio(render, window.devicePixelRatio);
            
            // Reposition boundaries
            Matter.Body.setPosition(ground, { x: newWidth / 2, y: newHeight + wallThickness / 2 });
            Matter.Body.setScale(ground, newWidth / width, 1);
            
            Matter.Body.setPosition(rightWall, { x: newWidth + wallThickness / 2, y: newHeight / 2 });
            Matter.Body.setScale(rightWall, 1, newHeight / height);
        });
    </script>
</body>
</html>
