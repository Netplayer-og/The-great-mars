<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Studio - Escape of Mars</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 20px; background-color: #0b0a10; color: #fff;
            font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: #a855f7; font-size: 20px; margin-bottom: 20px; text-shadow: 3px 3px 0px #000; }
        .back-link { position: absolute; top: 15px; left: 15px; color: #aaa; text-decoration: none; font-size: 10px; }
        .panel-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 950px; }
        .panel {
            background: #181524; border: 3px solid #a855f7; padding: 20px;
            box-shadow: 6px 6px 0px #000; flex: 1; min-width: 320px; box-sizing: border-box;
        }
        h2 { font-size: 12px; color: #c084fc; margin-top: 0; }
        label { display: block; font-size: 8px; margin: 12px 0 6px 0; color: #aaa; }
        input, select, textarea {
            width: 100%; padding: 10px; background: #0d0b14; border: 2px solid #332d4a;
            color: #fff; font-family: 'Press Start 2P', cursive; font-size: 8px;
            box-sizing: border-box; margin-bottom: 10px;
        }
        .btn {
            display: block; width: 100%; text-align: center; background: #a855f7; color: #fff;
            padding: 12px; font-family: 'Press Start 2P', cursive; font-size: 10px;
            border: none; cursor: pointer; box-shadow: 4px 4px 0px #000; margin-top: 10px;
        }
        .btn:hover { background: #9333ea; }
        .btn-green { background: #22c55e; }
        .btn-green:hover { background: #16a34a; }
        textarea { height: 70px; resize: none; word-break: break-all; }
        .box { background: #0d0b14; border: 1px solid #332d4a; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ MAIN MENU</a>
    <h1>ADVANCED MOD STUDIO</h1>

    <div class="panel-container">
        <div class="panel">
            <h2>🛠️ MECHANICS TEMPLATES & CARD LOGO</h2>
            
            <label>MODE NAME:</label>
            <input type="text" id="mod-title" placeholder="e.g. Lava Invasion">

            <label>BUTTON EMOJI LOGO:</label>
            <input type="text" id="mod-emoji" placeholder="e.g. 🌋, 🧱, 💬, 🚀" value="🌋">

            <label>GAME MECHANICS TEMPLATE:</label>
            <select id="mod-template">
                <option value="empty">Empty (Free Explore)</option>
                <option value="lava">Lava Mode (Rising Lava / Avoid Floor)</option>
                <option value="rp">RP Mode (Full Dialogue / Hangout)</option>
                <option value="building">Building Mode (Click to Place Blocks)</option>
            </select>

            <label>BACKGROUND (COLOR OR UPLOAD IMAGE):</label>
            <input type="color" id="bg-color" value="#1a162b">
            <input type="file" id="bg-file" accept="image/*">

            <h2>👤 CHARACTERS & AI ROLES</h2>
            <div class="box">
                <label>CHARACTER NAME:</label>
                <input type="text" id="npc-name" placeholder="e.g. Martian Guard">

                <label>EXISTING FOLDER CHARACTERS OR UPLOAD IMAGE:</label>
                <select id="npc-sprite-select" onchange="toggleUploadInput()">
                    <option value="Pixelgame/musa.png">Musa</option>
                    <option value="Pixelgame/mas.png">Mas</option>
                    <option value="Pixelgame/net.png">Net</option>
                    <option value="Pixelgame/wasi.png">Wasi</option>
                    <option value="Pixelgame/nyx.png">Nyx</option>
                    <option value="Pixelgame/timmy.png">Timmy</option>
                    <option value="UPLOAD">-- UPLOAD CUSTOM IMAGE --</option>
                </select>

                <input type="file" id="npc-file" accept="image/*" style="display:none;">

                <label>CHARACTER ROLE (AI PRIORITY):</label>
                <select id="npc-role">
                    <option value="enemy">Enemy (Chases & Deals Damage)</option>
                    <option value="neutral">Neutral (Stands Still / Talks on Touch)</option>
                    <option value="team">Team (Follows Player as Companion)</option>
                    <option value="roamer">Roamer (Wanders Around Randomly)</option>
                </select>

                <label>DIALOGUE MESSAGE:</label>
                <input type="text" id="npc-dialogue" placeholder="e.g. Watch out for the lava!">
            </div>

            <button class="btn" onclick="buildAndExportMod()">CREATE & SAVE MOD</button>
        </div>

        <div class="panel">
            <h2>📦 SHARE & IMPORT</h2>
            <label>MOD SHARE CODE:</label>
            <textarea id="export-code" readonly placeholder="Click 'Create & Save' to generate code..."></textarea>
            <button class="btn" onclick="copyModCode()">COPY CODE</button>

            <hr style="border-color: #332d4a; margin: 20px 0;">

            <label>PASTE FRIEND'S CODE HERE:</label>
            <textarea id="import-code" placeholder="Paste mod code string..."></textarea>
            <button class="btn btn-green" onclick="importModCode()">INSTALL MOD</button>
        </div>
    </div>

    <script>
        function toggleUploadInput() {
            const select = document.getElementById('npc-sprite-select');
            document.getElementById('npc-file').style.display = select.value === 'UPLOAD' ? 'block' : 'none';
        }

        function fileToDataURL(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        async function buildAndExportMod() {
            const title = document.getElementById('mod-title').value.trim() || "Custom Mode";
            const emoji = document.getElementById('mod-emoji').value.trim() || "🎮";
            const template = document.getElementById('mod-template').value;
            const bgColor = document.getElementById('bg-color').value;

            // Background Image Upload Check
            const bgFile = document.getElementById('bg-file').files[0];
            const bgImageData = await fileToDataURL(bgFile);

            // Character Image Upload / Selection
            const select = document.getElementById('npc-sprite-select');
            let npcSprite = select.value;
            if (select.value === 'UPLOAD') {
                const npcFile = document.getElementById('npc-file').files[0];
                npcSprite = (await fileToDataURL(npcFile)) || 'Pixelgame/musa.png';
            }

            const npcName = document.getElementById('npc-name').value.trim() || "Npc";
            const npcRole = document.getElementById('npc-role').value;
            const npcDialogue = document.getElementById('npc-dialogue').value.trim() || "Hello!";

            const modObj = {
                id: 'mod_' + Date.now(),
                title: title,
                emoji: emoji,
                template: template,
                bgColor: bgColor,
                bgImage: bgImageData,
                npc: {
                    name: npcName,
                    sprite: npcSprite,
                    role: npcRole,
                    talk: npcName + ": " + npcDialogue,
                    x: 400, y: 250, vx: 2, vy: 2
                }
            };

            let customMods = JSON.parse(localStorage.getItem('mars_custom_mods') || '[]');
            customMods.push(modObj);
            localStorage.setItem('mars_custom_mods', JSON.stringify(customMods));

            const jsonString = JSON.stringify(modObj);
            document.getElementById('export-code').value = btoa(encodeURIComponent(jsonString));

            alert("Mod successfully created and saved to Main Menu!");
        }

        function copyModCode() {
            const codeBox = document.getElementById('export-code');
            if (!codeBox.value) return alert("Generate a code first!");
            codeBox.select();
            navigator.clipboard.writeText(codeBox.value);
            alert("Copied code to clipboard!");
        }

        function importModCode() {
            const rawCode = document.getElementById('import-code').value.trim();
            if (!rawCode) return alert("Paste a code first!");
            try {
                const modObj = JSON.parse(decodeURIComponent(atob(rawCode)));
                let customMods = JSON.parse(localStorage.getItem('mars_custom_mods') || '[]');
                customMods.push(modObj);
                localStorage.setItem('mars_custom_mods', JSON.stringify(customMods));
                alert(`Installed "${modObj.title}"!`);
            } catch (err) {
                alert("Invalid Code!");
            }
        }
    </script>
</body>
</html>
