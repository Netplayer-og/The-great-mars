    <style>
        body {
            margin: 0; padding: 0;
            background: #0f0c1b; color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        h1 { 
            font-size: 30px; 
            color: #ff4500; 
            text-shadow: 4px 4px 0px #000; 
            margin-bottom: 15px; 
        }

        /* TOP BUTTONS */
        .top-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .top-nav a {
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: white;
            background: #181524;
            border: 3px solid #3d355c;
            padding: 10px 12px;
            text-decoration: none;
            box-shadow: 3px 3px 0px #000;
            transition: all 0.2s;
        }

        .top-nav a:hover {
            transform: translate(-2px, -2px);
            border-color: #ff4500;
            color: #ff4500;
        }

        .login-box {
            background: #181524; 
            border: 3px solid #ff4500; 
            padding: 15px;
            margin-bottom: 25px; 
            box-shadow: 4px 4px 0px #000; 
            text-align: center;
        }

        input[type="text"] {
            font-family: 'Press Start 2P', cursive; 
            padding: 8px; 
            font-size: 8px;
            background: #0b0a10; 
            border: 2px solid #332d4a; 
            color: #fff; 
            margin-right: 5px;
        }

        .btn-login {
            font-family: 'Press Start 2P', cursive; 
            padding: 8px 12px; 
            font-size: 8px;
            background: #ff4500; 
            color: white; 
            border: none; 
            cursor: pointer;
        }

        .modes-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: none;
            box-sizing: border-box;
            padding: 0 20px;
        }

        .mode-card {
            background: #1c182d; 
            border: 4px solid #3d355c; 
            padding: 15px;
            width: 180px; 
            text-align: center; 
            cursor: pointer; 
            text-decoration: none; 
            color: white;
            box-shadow: 5px 5px 0px #000; 
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .mode-card:hover { 
            transform: translate(-2px, -2px); 
            border-color: #ff4500; 
        }


        /* ========================= */
        /* SETTINGS SIDE BAR */
        /* ========================= */

        .settings-tab {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #181524;
            border: 3px solid #ff4500;
            border-right: none;
            padding: 14px 10px;
            color: white;
            font-size: 9px;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 3px 0px #000;
            writing-mode: vertical-rl;
        }

        .settings-tab:hover {
            color: #ff4500;
        }

        .settings-panel {
            position: fixed;
            right: -300px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #181524;
            border-left: 4px solid #ff4500;
            box-shadow: -6px 0px 0px #000;
            z-index: 1000;
            transition: right 0.3s ease;
            box-sizing: border-box;
            padding: 25px 20px;
            overflow-y: auto;
        }

        .settings-panel.open {
            right: 0;
        }

        .settings-title {
            font-size: 16px;
            color: #ff4500;
            margin-bottom: 25px;
            text-shadow: 3px 3px #000;
        }

        .settings-section {
            margin-bottom: 25px;
        }

        .settings-label {
            font-size: 9px;
            color: #aaa;
            display: block;
            margin-bottom: 12px;
        }

        .setting-option {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 8px;
            background: #0f0c1b;
            color: white;
            border: 2px solid #3d355c;
            font-family: inherit;
            font-size: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }

        .setting-option:hover {
            border-color: #ff4500;
            transform: translateX(-3px);
        }

        .setting-option.selected {
            border-color: #ff4500;
            background: #29213d;
            color: #ff4500;
        }

        .close-settings {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-family: inherit;
        }

        .close-settings:hover {
            color: #ff4500;
        }


        /* ========================= */
        /* THEMES */
        /* ========================= */

        body.theme-red {
            background: #210707;
        }

        body.theme-red .login-box,
        body.theme-red .top-nav a,
        body.theme-red .mode-card,
        body.theme-red .settings-panel,
        body.theme-red .settings-tab {
            background: #321010;
        }

        body.theme-red .mode-card,
        body.theme-red .top-nav a {
            border-color: #7a2222;
        }

        body.theme-pink {
            background: #210d1a;
        }

        body.theme-pink .login-box,
        body.theme-pink .top-nav a,
        body.theme-pink .mode-card,
        body.theme-pink .settings-panel,
        body.theme-pink .settings-tab {
            background: #35152a;
        }

        body.theme-pink h1,
        body.theme-pink .settings-title {
            color: #ff69b4;
        }

        body.theme-pink .login-box,
        body.theme-pink .settings-panel,
        body.theme-pink .settings-tab {
            border-color: #ff69b4;
        }

        body.theme-blue {
            background: #071525;
        }

        body.theme-blue .login-box,
        body.theme-blue .top-nav a,
        body.theme-blue .mode-card,
        body.theme-blue .settings-panel,
        body.theme-blue .settings-tab {
            background: #10243a;
        }

        body.theme-blue h1,
        body.theme-blue .settings-title {
            color: #38aaff;
        }

        body.theme-blue .login-box,
        body.theme-blue .settings-panel,
        body.theme-blue .settings-tab {
            border-color: #38aaff;
        }

        body.theme-green {
            background: #071c12;
        }

        body.theme-green .login-box,
        body.theme-green .top-nav a,
        body.theme-green .mode-card,
        body.theme-green .settings-panel,
        body.theme-green .settings-tab {
            background: #0e2b1d;
        }

        body.theme-green h1,
        body.theme-green .settings-title {
            color: #35d07f;
        }

        body.theme-green .login-box,
        body.theme-green .settings-panel,

        /* ========================= */

        /* ========================= */

        body.font-italic .settings-tab,
        body.font-italic .setting-option {

        body.font-innocent input,

        body.font-innocent .settings-panel,
        body.font-innocent .settings-tab,
        body.font-innocent .setting-option {
            font-family: "Trebuchet MS", sans-serif;
        }
    </style>
</head>

    <script>
        /* ========================= */
        /* ACCOUNT */
        /* ========================= */

        function loadUser() {
            let u = localStorage.getItem('mars_user') || "Guest";
            document.getElementById('active-user').innerText = u;
        }

        function saveUser() {
            let val = document.getElementById('username-input').value.trim();
            if (val) {
                localStorage.setItem('mars_user', val);
                loadUser();
                alert("Account saved as: " + val);
            }
        }


        /* ========================= */
        /* SETTINGS */
        /* ========================= */

        function toggleSettings() {
            document.getElementById('settings-panel').classList.toggle('open');
        }


        function setTheme(theme) {
            document.body.classList.remove(
                'theme-red',
                'theme-pink',
                'theme-blue',
                'theme-green'
            );

            if (theme !== 'classic') {
                document.body.classList.add('theme-' + theme);
            }

            localStorage.setItem('net_theme', theme);
            updateSelectedButtons();
        }


        function setFont(font) {
            document.body.classList.remove(
                'font-press',
                'font-comic',
                'font-italic',
                'font-innocent'
            );

            document.body.classList.add('font-' + font);

            localStorage.setItem('net_font', font);
            updateSelectedButtons();
        }


        function updateSelectedButtons() {
            let currentTheme = localStorage.getItem('net_theme') || 'classic';
            let currentFont = localStorage.getItem('net_font') || 'press';

            document.querySelectorAll('[data-theme]').forEach(button => {
                button.classList.remove('selected');

                if (button.dataset.theme === currentTheme) {
                    button.classList.add('selected');
                }
            });

            document.querySelectorAll('[data-font]').forEach(button => {
                button.classList.remove('selected');

                if (button.dataset.font === currentFont) {
                    button.classList.add('selected');
                }
            });
        }


        function loadSettings() {
            let savedTheme = localStorage.getItem('net_theme') || 'classic';
            let savedFont = localStorage.getItem('net_font') || 'press';

            setTheme(savedTheme);
            setFont(savedFont);
            updateSelectedButtons();
        }


        loadUser();
        loadSettings();
    </script>
