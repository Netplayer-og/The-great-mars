<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMMER SMASH - Beach Chaos Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #051923;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Side Control Panel */
        #sidebar {
            width: 300px;
            background-color: #003554;
            border-right: 2px solid #006494;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.4rem;
            color: #ffb703;
            border-bottom: 2px solid #006494;
            padding-bottom: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.85rem;
            color: #caf0f8;
            font-weight: bold;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        button {
            padding: 12px;
            background-color: #006494;
            border: 1px solid #48cae4;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #0077b6;
            transform: translateY(-1px);
        }
        button.active {
            background-color: #ffb703;
            color: #003554;
            border-color: #fb8500;
        }
        
        /* Stats Dashboard */
        .stats-box {
            background: #001d3d;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #006494;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.9rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
        }
        .stat-val {
            color: #ffb703;
            font-weight: bold;
        }

        /* Beach Canvas Area */
        #beach-container {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(to bottom, #87ceeb 50%, #f4d06f 50%);
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        
        .instructions {
            font-size: 0.8rem;
            color: #ade8f4;
            line-height: 1.4;
            margin-top: auto;
            background: #001d3d;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Side Control Panel -->
    <div id="sidebar">
        <h1>🌴 SUMMER SMASH</h1>
        
        <div class="control-group">
            <label>Select Summer Activity</label>
            <div class="btn-grid">
                <button id="btn-coconut" class="active" onclick="setTool('coconut')">🥥 Kick Coconut</button>
                <button id="btn-castle" onclick="setTool('castle')">🏰 Build Sand Castle</button>
                <button id="btn-kid" onclick="setTool('kid')">👶 Annoy Beach Kids</button>
            </div>
        </div>

        <div class="control-group">
            <label>Chaos Stats</label>
            <div class="stats-box">
                <div class="stat-row"><span>Coconuts Kicked:</span> <span id="stat-coconut" class="stat-val">0</span></div>
                <div class="stat-row"><span>Castles Built:</span> <span id="stat-castle" class="stat-val">0</span></div>
                <div class="stat-row"><span>Kids Annoyed:</span> <span id="stat-kid" class="stat-val">0</span></div>
            </div>
        </div>

        <div class="instructions">
            <strong>How to Play:</strong><br>
            • Click anywhere on the beach to perform your selected summer activity!<br>
            • Kick coconuts into the ocean, erect towering castles, or poke unsuspecting vacation kids.
        </div>
    </div>

    <!-- Canvas Viewport -->
    <div id="beach-container"></div>

    <script>
        const container = document.getElementById('beach-container');
        const canvas = document.createElement('canvas');
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        let currentTool = 'coconut';
        let stats = { coconut: 0, castle: 0, kid: 0 };
        let entities = [];

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setTool(tool) {
            currentTool = tool;
            ['coconut', 'castle', 'kid'].forEach(t => {
                document.getElementById(`btn-${t}`).classList.remove('active');
            });
            document.getElementById(`btn-${tool}`).classList.add('active');
            playSfx('click');
        }

        // --- Web Audio Sound Engine ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'coconut') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'castle') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(450, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'kid') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        // --- Entity Objects ---
        class BeachEntity {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.age = 0;
                
                if (type === 'coconut') {
                    this.vx = (Math.random() - 0.5) * 6;
                    this.vy = -Math.random() * 4 - 2;
                    this.radius = 18;
                } else if (type === 'kid') {
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = 0;
                    this.text = ["WAAAH!", "Mommy!", "Hey! 🏖️", "Stop it!"][Math.floor(Math.random() * 4)];
                }
            }

            update() {
                this.age++;
                if (this.type === 'coconut') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.3; // gravity
                    // bounce off floor
                    if (this.y > canvas.height - 40) {
                        this.y = canvas.height - 40;
                        this.vy *= -0.5;
                        this.vx *= 0.8;
                    }
                }
            }

            draw() {
                ctx.save();
                if (this.type === 'coconut') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#5c4033';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#3e2723';
                    ctx.stroke();
                    ctx.closePath();
                } else if (this.type === 'castle') {
                    ctx.fillStyle = '#e9c46a';
                    ctx.fillRect(this.x - 30, this.y - 40, 60, 40);
                    ctx.fillStyle = '#f4a261';
                    // towers
                    ctx.fillRect(this.x - 35, this.y - 60, 15, 60);
                    ctx.fillRect(this.x + 20, this.y - 60, 15, 60);
                } else if (this.type === 'kid') {
                    // Simple cartoon kid face / body
                    ctx.font = "28px sans-serif";
                    ctx.fillText("👶", this.x - 14, this.y);
                    if (this.age < 60) {
                        ctx.fillStyle = '#ff595e';
                        ctx.font = "bold 14px sans-serif";
                        ctx.fillText(this.text, this.x - 20, this.y - 20);
                    }
                }
                ctx.restore();
            }
        }

        // Click interaction
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Restrict activity to sand area (bottom half)
            if (y < canvas.height * 0.45 && currentTool !== 'coconut') {
                return; // keep castles and kids on the sand
            }

            stats[currentTool]++;
            document.getElementById(`stat-${currentTool}`).innerText = stats[currentTool];
            playSfx(currentTool);

            entities.push(new BeachEntity(x, y, currentTool));
        });

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Ocean & Sand background split lines
            ctx.fillStyle = '#48cae4';
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.5);
            ctx.fillStyle = '#f4d06f';
            ctx.fillRect(0, canvas.height * 0.5, canvas.width, canvas.height * 0.5);

            // Update and draw entities
            entities.forEach(ent => {
                ent.update();
                ent.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
