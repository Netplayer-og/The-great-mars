<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Mode - Escape of Mars</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0b0a10; color: #fff;
            font-family: 'Press Start 2P', cursive;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }

        h1 { color: #00b4d8; font-size: 24px; margin-bottom: 10px; text-shadow: 3px 3px 0px #000; }
        .back-link { position: absolute; top: 15px; left: 15px; color: #aaa; text-decoration: none; font-size: 10px; }
        .back-link:hover { color: #00b4d8; }

        canvas {
            border: 4px solid #00b4d8;
            background-color: #e9c46a;
            box-shadow: 6px 6px 0px #000;
            image-rendering: pixelated;
        }

        /* BADGE POPUP NOTIFICATION STYLES */
        #badge-toast {
            position: fixed; top: 20px; right: -350px;
            background: #181524; border: 3px solid #ffd700;
            box-shadow: 4px 4px 0px #000; padding: 12px;
            display: flex; align-items: center; gap: 12px;
            z-index: 999; transition: right 0.4s ease-in-out;
            border-radius: 4px; font-family: 'Press Start 2P', cursive;
        }
        #badge-toast.show { right: 20px; }
        #badge-toast img { width: 40px; height: 40px; image-rendering: pixelated; }
        .badge-info h4 { margin: 0; font-size: 8px; color: #ffd700; }
        .badge-info p { margin: 4px 0 0 0; font-size: 6px; color: #aaa; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">⬅ MAIN MENU</a>
    <h1>SUMMER MODE</h1>

    <canvas id="canvas" width="800" height="500"></canvas>

    <!-- BADGE UNLOCK NOTIFICATION TOAST -->
    <div id="badge-toast">
        <img id="badge-icon" src="" alt="Badge">
        <div class="badge-info">
            <h4 id="badge-title">BADGE UNLOCKED!</h4>
            <p id="badge-desc">You unlocked a new achievement.</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const badgeAudio = new Audio('SFX/applepay.mp3');
        const user = localStorage.getItem('mars_user') || "Guest";

        const badgeData = {
            social: { title: "SOCIAL BUTTERFLY", desc: "Listened to beach chatter", icon: "Pixelgame/socialbadge.png" },
            chillax: { title: "CHILLAX CHAMP", desc: "Took a dip in the ocean", icon: "Pixelgame/chillaxbadge.png" },
            victory: { title: "MARS CONQUEROR", desc: "Talked with everyone at the beach", icon: "Pixelgame/victorybadge.png" },
            memorial: { title: "MARTIAN MEMORIAL", desc: "Fell in battle on Mars", icon: "Pixelgame/memorialbadge.png" }
        };

        function unlockBadge(badgeKey) {
            let userBadges = JSON.parse(localStorage.getItem(user + '_badges') || '{}');
            if (userBadges[badgeKey]) return;

            userBadges[badgeKey] = true;
            localStorage.setItem(user + '_badges', JSON.stringify(userBadges));

            badgeAudio.currentTime = 0;
            badgeAudio.play().catch(e => {});

            let badge = badgeData[badgeKey];
            if (badge) {
                document.getElementById('badge-icon').src = badge.icon;
                document.getElementById('badge-title').innerText = badge.title;
                document.getElementById('badge-desc').innerText = badge.desc;

                let toast = document.getElementById('badge-toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3500);
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'dialogue') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(350 + Math.random() * 200, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        const images = {};
        const imageSources = {
            musa: 'Pixelgame/musa.png',
            mas: 'Pixelgame/mas.png',
            net: 'Pixelgame/net.png',
            wasi: 'Pixelgame/wasi.png',
            nyx: 'Pixelgame/nyx.png',
            timmy: 'Pixelgame/timmy.png'
        };

        for (let key in imageSources) {
            images[key] = new Image();
            images[key].src = imageSources[key];
        }

        const player = { x: 100, y: 250, size: 60, speed: 4 };

        // RESTORED ALL FRIENDS ON THE BEACH WITH TALK DIALOGUES
        const npcs = [
            { id: 'mas', x: 250, y: 120, talk: "Mas: Bro the sun on Mars is hitting different today!", talked: false },
            { id: 'net', x: 400, y: 150, talk: "Net: Beach Wi-Fi is somehow faster than school Wi-Fi.", talked: false },
            { id: 'wasi', x: 280, y: 350, talk: "Wasi: Anyone brought cold Fanta to the beach?", talked: false },
            { id: 'nyx', x: 420, y: 380, talk: "Nyx: No SAB trading at the beach, only relaxation!", talked: false },
            { id: 'timmy', x: 620, y: 250, talk: "Timmy: WATER GRIDDY IN THE OCEAN HAHAA!", talked: false }
        ];

        let dialogueText = "Walk up to your friends at the beach to talk!";
        let dialogueTimer = 0;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            if ((keys['w'] || keys['arrowup']) && player.y > 40) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - 40) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > 40) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - 40) player.x += player.speed;

            // Talk proximity detection
            npcs.forEach(npc => {
                let dist = Math.hypot(player.x - npc.x, player.y - npc.y);
                if (dist < 70) {
                    if (dialogueText !== npc.talk) playSound('dialogue');
                    dialogueText = npc.talk;
                    dialogueTimer = 120;
                    if (!npc.talked) {
                        npc.talked = true;
                        unlockBadge('social');
                    }
                }
            });

            if (npcs.every(n => n.talked)) {
                unlockBadge('victory');
            }

            // Unlock Chillax Badge when entering ocean (x > 520)
            if (player.x > 520) {
                unlockBadge('chillax');
            }

            if (dialogueTimer > 0) dialogueTimer--;
        }

        function drawSprite(imgKey, x, y, size) {
            if (images[imgKey] && images[imgKey].complete && images[imgKey].naturalWidth !== 0) {
                ctx.drawImage(images[imgKey], x - size/2, y - size/2, size, size);
            } else {
                ctx.fillStyle = '#00b4d8';
                ctx.fillRect(x - size/2, y - size/2, size, size);
            }
        }

        function draw() {
            // Beach Sand Background
            ctx.fillStyle = "#e9c46a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ocean Area
            ctx.fillStyle = "#00b4d8";
            ctx.fillRect(520, 0, 280, canvas.height);

            // Draw all friends
            npcs.forEach(npc => drawSprite(npc.id, npc.x, npc.y, 60));

            // Player
            drawSprite('musa', player.x, player.y, player.size);

            // Dialogue Box
            ctx.fillStyle = "rgba(24, 21, 36, 0.95)";
            ctx.fillRect(50, 420, 700, 50);
            ctx.strokeStyle = "#00b4d8";
            ctx.lineWidth = 2;
            ctx.strokeRect(50, 420, 700, 50);

            ctx.fillStyle = "#ffffff";
            ctx.font = "7px 'Press Start 2P'";
            ctx.fillText(dialogueText, 65, 450);

            // HUD
            ctx.fillStyle = "#000";
            ctx.font = "8px 'Press Start 2P'";
            ctx.fillText(player.x > 520 ? "STATUS: CHILLIN' IN WATER 🌊" : "STATUS: ON THE BEACH 🏖️", 20, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
